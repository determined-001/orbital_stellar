name: Release

on:
  push:
    tags:
      - "v*"

# cancel-in-progress: false - never interrupt an in-flight release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # ── Build and test gate ───────────────────────────────────────────────
      # The release is aborted if any of these steps fail - a broken build
      # or failing tests must never result in a published release.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pulse-core
        run: pnpm tsc -p packages/pulse-core/tsconfig.json

      - name: Build pulse-webhooks
        run: pnpm tsc -p packages/pulse-webhooks/tsconfig.json

      - name: Typecheck pulse-notify
        run: pnpm tsc --noEmit -p packages/pulse-notify/tsconfig.json

      - name: Typecheck apps/web
        run: pnpm tsc --noEmit -p apps/web/tsconfig.json

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm -r --if-present test

      - name: Generate open data artifacts
        run: node scripts/generate-open-data.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            data/taxonomy.json
            data/labels.json
            data/integrity.json
            data/LICENSE

      # ── npm publish ───────────────────────────────────────────────────────
      # Packages are already live on npm under the @orbital-stellar scope;
      # this step publishes each subsequent tagged version bump.
      - name: Publish packages to npm
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
