name: Contracts

on:
  push:
    branches: [main]
  pull_request:
  # The provenance check only ran when a PR touched contracts/**, so a
  # deployment that stopped matching its source stayed invisible on main for
  # three weeks - it surfaced only because an unrelated PR added a file under
  # contracts/. A weekly run catches that drift on its own.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned, not @stable: the recorded WASM hashes are only reproducible on
      # the compiler they were built with, and @stable ignores
      # contracts/rust-toolchain.toml. Keep this in step with the `channel`
      # there - contracts/build-wasm.sh fails loudly if the two drift.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          # wasm32-unknown-unknown is rejected by soroban-sdk's build script on
          # Rust 1.82+ (reference-types/multi-value are on by default there and
          # unsupported by the Soroban environment) - wasm32v1-none is the
          # supported target.
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: cargo test
        working-directory: contracts
        run: cargo test

      - name: Build contract WASM (pinned toolchain, paths remapped)
        run: ./contracts/build-wasm.sh

  verify-provenance:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned for the same reason as the test job above.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32v1-none

      # Dependency downloads are cached; build artifacts deliberately are NOT.
      #
      # This job's entire purpose is to rebuild the contracts from source and
      # prove the bytes match what was deployed. Restoring a prebuilt `target/`
      # defeats exactly that: rust-cache falls back to a prefix restore-key when
      # there is no exact hit, so the job was reusing artifacts built from a
      # different commit and then "verifying" those. It reported
      # `Finished release profile in 1.31s` for three Soroban contracts that
      # take ~49s to build from clean - and produced a registry hash
      # (5c800423...) that no checkout of this repository can reproduce.
      #
      # A provenance check that trusts a cache is not a provenance check.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          cache-targets: false
          save-if: false

      - uses: cargo-bins/cargo-binstall@main

      - name: Install stellar-cli
        run: cargo binstall -y stellar-cli@25.2.0

      - name: Build contract WASM (pinned toolchain, paths remapped)
        run: ./contracts/build-wasm.sh

      - name: Verify deployed provenance
        working-directory: contracts
        run: |
          set -euo pipefail

          # Maps a manifest contract key to the WASM artefact build-wasm.sh
          # produces. A key here that the build does not produce is a bug in
          # the manifest, not something to skip past.
          wasm_for() {
            case "$1" in
              registry)    echo "orbital_abi_registry" ;;
              demoEmitter) echo "orbital_demo_emitter" ;;
              payroll)     echo "orbital_payroll" ;;
              *) echo "::error::Unknown contract key '$1' in manifest - no WASM mapping."; return 1 ;;
            esac
          }

          verified_any=0

          # Every network Orbital deploys to gets the same treatment. A missing
          # manifest means that network has not been deployed to yet.
          for manifest in deployed.*.json; do
            [ -e "$manifest" ] || continue

            NETWORK=$(jq -r '.network' "$manifest")

            # The checked-in manifest documents the shape before the contracts
            # are actually deployed; deploy.sh fills in the ids and hashes.
            # Until then there is nothing to verify.
            if jq -e '[.contracts[] | select((.contractId | startswith("<")) or (.wasmHash == ""))] | length > 0' \
                 "$manifest" > /dev/null; then
              echo "$manifest still holds deploy.sh placeholders. Skipping."
              continue
            fi

            echo "==> Verifying $manifest (network: $NETWORK)"

            : > "expected_$NETWORK.txt"
            : > "actual_$NETWORK.txt"
            : > "onchain_$NETWORK.txt"

            # Every contract in the manifest is checked - adding one to a
            # deployment automatically brings it under provenance, rather than
            # needing this job edited too.
            for key in $(jq -r '.contracts | keys[]' "$manifest"); do
              wasm="target/wasm32v1-none/release/$(wasm_for "$key").wasm"

              if [ ! -f "$wasm" ]; then
                echo "::error::$manifest names '$key' but $wasm was not built."
                exit 1
              fi

              expected=$(jq -r --arg k "$key" '.contracts[$k].wasmHash' "$manifest")
              id=$(jq -r --arg k "$key" '.contracts[$k].contractId' "$manifest")

              echo "$key: $expected" >> "expected_$NETWORK.txt"
              echo "$key: $(sha256sum "$wasm" | awk '{print $1}')" >> "actual_$NETWORK.txt"

              stellar contract fetch --id "$id" --network "$NETWORK" --out-file "onchain_${NETWORK}_${key}.wasm"
              echo "$key: $(sha256sum "onchain_${NETWORK}_${key}.wasm" | awk '{print $1}')" >> "onchain_$NETWORK.txt"
            done

            echo "==> Comparing local build against $manifest..."
            if ! diff -u "expected_$NETWORK.txt" "actual_$NETWORK.txt"; then
              echo "::error::WASM hashes do not match $manifest! Did you modify contracts without updating the deployment?"
              exit 1
            fi

            echo "==> Comparing local build against the $NETWORK network..."
            if ! diff -u "actual_$NETWORK.txt" "onchain_$NETWORK.txt"; then
              echo "::error::On-chain WASM hashes on $NETWORK do not match local build! The network state has drifted or was maliciously altered."
              exit 1
            fi

            echo "    $NETWORK provenance verified."
            verified_any=1
          done

          if [ "$verified_any" -eq 0 ]; then
            echo "No populated deployment manifests found. Nothing to verify."
            exit 0
          fi

          echo "Provenance verification passed! (All hashes match)"
